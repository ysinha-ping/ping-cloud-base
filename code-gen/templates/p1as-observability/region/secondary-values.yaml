# Overrides applied to child/secondary CDE regions at code-gen time.
# Merged into values.yaml by generate-cluster-state.sh when REGION != PRIMARY_REGION.
#
# ### prometheus-agent ###
# 1. remoteWrite: In child regions p1as-prometheus (server) is removed via
#    PRIMARY_REGION_ONLY_DEPLOY, so "prometheus-headless:9090" does not resolve.
#    Override the URL to point to the primary region's Prometheus server via
#    the cross-region DNS record created by external-dns on the headless service.
#
# 1. opensearch-grafana-credentials: The secret is created by p14c-integration in os-controller-manager which only 
#    runs in the primary region. Remove volume mounts for prometheus-agent so it can start without the secret in child regions.
#
# 3. extraManifests: We use extraManifests because the base Prometheus Helm chart lacks a native toggle to set the service type to ExternalName.
#    This injects a cross-region DNS alias so that the prometheus agent in child regions can send its data to the primary region,
#    and so volume-autoscaler can source metrics from the primary Prometheus. Since p1as-prometheus is not deployed in secondary regions,
#    this ExternalName Service is the only prometheus-headless service in the cluster.
#
# ### nri-bundle.newrelic-prometheus-agent ###
# 1. opensearch-newrelic-credentials: The secret is created by p14c-integration in os-controller-manager which only 
#    runs in the primary region. Remove volume mounts for the newrelic-prometheus-agent so it can start without the 
#    secret in child regions.
prometheus-agent:
  extraManifests:
    - |
      apiVersion: v1
      kind: Service
      metadata:
        name: prometheus-headless
        namespace: prometheus
      spec:
        type: ExternalName
        externalName: prometheus-central.${PRIMARY_DNS_ZONE}

  server:
    remoteWrite:
      - url: 'http://prometheus-central.${PRIMARY_DNS_ZONE}:9090/api/v1/write'
    #Extra volumes and volume mounts are intentionally left blank to remove the opensearch-grafana-credentials secret from child regions.
    extraVolumes: []
    extraVolumeMounts: []

nri-bundle:
  newrelic-prometheus-agent:
    #Extra volumes and volume mounts are intentionally left blank to remove the opensearch-newrelic-credentials secret from child regions.
    extraVolumes: []
    extraVolumeMounts: []

# OpenSearch in secondary regions:
# - global.region and global.primaryRegion are set to the real values by
#   code-gen (base values.yaml: region="${REGION}", primaryRegion="${PRIMARY_REGION}").
#   Since REGION != PRIMARY_REGION in a secondary, the chart's
#   `eq global.primaryRegion global.region` gate evaluates false, so the
#   cluster CR, dashboards, security configs, storageclass and SSO PreSync
#   Job are all suppressed automatically.
# - opensearch.enabled remains true so cluster-info CM and the opensearch-ingest
#   ExternalName Service render. Logstash-elastic in this region reads
#   cluster.name/logs.region from cluster-info, and routes to the primary via
#   the ExternalName (opensearch.<primaryDnsZone>).
# - SSO bootstrap is suppressed by the primaryRegion gate (isMicroserviceDeploy=false
#   in CDE but primaryRegion != region, so the gate evaluates false).
# - Set opensearch-operator.enabled=false to suppress the entire operator
#   subchart (Deployment, RBAC, SA, ConfigMap) in secondary regions. There is
#   no OpenSearchCluster CR to manage here so the operator serves no purpose.
opensearch-operator:
  enabled: false