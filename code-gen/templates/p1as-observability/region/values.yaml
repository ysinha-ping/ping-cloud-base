#Cloudwatch related values
cloudwatch:
  enabled : ${CLOUDWATCH_ENABLED}
#The IRSA role ARN to be used for the CWAgent serviceAccount, for the customer environment
  irsaCwAgentAnnotationKeyValue: "${IRSA_CWAGENT_ANNOTATION_KEY_VALUE}"

  resources:
    limits:
      cpu:  200m
      memory: 200Mi
    requests:
      cpu: 200m
      memory: 200Mi


#Newrelic related values

#######################################################
# Prometheus Server (p1as-prometheus) settings
#######################################################
prometheus:
  server:
    # Retention time for Prometheus. Could be set in years(y), weeks(w), days(d), hours(h), minutes(m) or seconds(s)
    retention: "15d"

    persistentVolume:
      # Storage size for prometheus data volume
      # Adjust based on retention period and scrape volume
      size: 30Gi

    statefulSet:
      headless:
        annotations:
          # Prometheus cross-region communication - DNS hostname for the headless service
          external-dns.alpha.kubernetes.io/hostname: prometheus-central.${VALUES_FILES_DNS_ZONE}

    # Environment variables injected into the Prometheus container.
    # The base chart sets external_labels with ${CLUSTER_NAME}, ${TENANT_NAME},
    # ${REGION_NICK_NAME} placeholders and enables --enable-feature=expand-external-labels,
    # so Prometheus expands them at runtime from these env vars.
    env:
      - name: CLUSTER_NAME
        value: ${CLUSTER_NAME}
      - name: TENANT_NAME
        value: ${TENANT_NAME}
      - name: REGION_NICK_NAME
        value: ${REGION_NICK_NAME}

    # Resource limits for dev/test environments (matches legacy PCB base/test size)
    # For prod environments, these are overridden by prod-values.yaml
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi

#######################################################
# Prometheus Job Exporter settings
#######################################################
prometheusJobExporter:
  image:
    tag: v3.0.0
  # Commands and schedules to obtain users count. Values should be in single quotes. 
  promUserCount1Command: "echo 0"
  promUserCount2Command: "echo 0"
  promUserCount3Command: "echo 0"
  promUserCount4Command: "echo 0"

  # Schedules should be in cron format. Command should return only numeric value(int\float)
  promUserCount1Schedule: "* * * * *"
  promUserCount2Schedule: "* * * * *"
  promUserCount3Schedule: "* * * * *"
  promUserCount4Schedule: "* * * * *"

  # Namespace where pingdirectory pods run (for user count commands)
  containerNamespace: ${PING_CLOUD_NAMESPACE}

#######################################################
# Prometheus Agent resource settings
#######################################################
prometheus-agent:
  server:
    # Environment variables for expand-external-labels (same as prometheus server above)
    env:
      - name: CLUSTER_NAME
        value: ${CLUSTER_NAME}
      - name: TENANT_NAME
        value: ${TENANT_NAME}
      - name: REGION_NICK_NAME
        value: ${REGION_NICK_NAME}

    resources:
      limits:
        cpu: 500m
        memory: 4000Mi
      requests:
        cpu: 100m
        memory: 512Mi

    # opensearch-grafana-credentials is created by the p1as-oauth init container on the
    # OpenSearch controller manager. Since PDO-5990 moved OpenSearch into this same
    # p1as-observability ArgoCD app, the secret may not exist on fresh install —
    # the OS operator creates it during its first sync. optional: true avoids a deadlock
    # where prometheus-agent crashes (secret missing) and blocks the OS operator from
    # deploying (which would create the secret).
    # secondary-values.yaml and chub-values.yaml clear extraVolumes/extraVolumeMounts
    # for secondary CDE regions and customer-hub where OpenSearch is not deployed.
    extraVolumes:
      - name: os-creds
        secret:
          secretName: opensearch-grafana-credentials
          optional: true
          items:
            - key: password
              path: os-password

# opensearch-newrelic-credentials is created by the p1as-oauth init container on the
# OpenSearch controller manager. Since PDO-5990 moved OpenSearch into this same
# p1as-observability ArgoCD app, the secret may not exist on fresh install —
# the OS operator creates it during its first sync. optional: true avoids the same
# intra-app deadlock as opensearch-grafana-credentials above.
# secondary-values.yaml and chub-values.yaml override this to remove the volume mount
# entirely for environments where OpenSearch is not deployed.
nri-bundle:
  newrelic-prometheus-agent:
    extraVolumes:
      - name: os-password
        secret:
          secretName: opensearch-newrelic-credentials
          optional: true
    extraVolumeMounts:
      - name: os-password
        mountPath: /etc/secrets
        readOnly: true

#######################################################
# Prometheus Adapter settings
#######################################################
prometheus-adapter:
  rules:
    custom:
      - seriesQuery: 'logstash_node_queue_size_bytes{kubernetes_namespace="elastic-stack-logging"}'
        resources:
          overrides:
            kubernetes_namespace:
              resource: namespace
            instance:
              resource: pod
        name:
          matches: logstash_node_queue_size_bytes
          as: logstash_queue_utilization_percent
        metricsQuery: >-
          sum((
            logstash_node_queue_size_bytes{<<.LabelMatchers>>, k8s_cluster_region="${REGION_NICK_NAME}", kubernetes_namespace="elastic-stack-logging"}
            /
            logstash_node_queue_max_size_bytes{<<.LabelMatchers>>, k8s_cluster_region="${REGION_NICK_NAME}", kubernetes_namespace="elastic-stack-logging"}
          ) * 100) by (<<.GroupBy>>)

      - seriesQuery: 'logstash_node_pipeline_events_in_total{kubernetes_namespace="elastic-stack-logging"}'
        resources:
          overrides:
            kubernetes_namespace:
              resource: namespace
            instance:
              resource: pod
        name:
          matches: logstash_node_pipeline_events_in_total
          as: logstash_events_in_rate
        metricsQuery: >-
          sum(rate(
            logstash_node_pipeline_events_in_total{<<.LabelMatchers>>, k8s_cluster_region="${REGION_NICK_NAME}", kubernetes_namespace="elastic-stack-logging"}[5m]
          )) by (<<.GroupBy>>)
          /
          clamp_min(
            sum(avg_over_time(
              rate(logstash_node_pipeline_events_in_total{<<.LabelMatchers>>, k8s_cluster_region="${REGION_NICK_NAME}", kubernetes_namespace="elastic-stack-logging"}[5m])[1h:5m]
            )) by (<<.GroupBy>>),
            1
          )

#######################################################
# OpenSearch (p1as-opensearch) settings
#######################################################

opensearch-cluster:
  hotNodes:
    # Default sizing for dev/test environments.
    # Stage/prod values override these fields in prod-values.yaml.
    jvm: "-Xms6g -Xmx6g"
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        cpu: "6"
        memory: 10Gi

  irsaAnnotationKeyValue: "${IRSA_OPENSEARCH_ANNOTATION_KEY_VALUE}"
  dashboards:
    baseRedirectUrl: "https://logs.${VALUES_FILES_DNS_ZONE}"
