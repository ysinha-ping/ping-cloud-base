# Prometheus resource limits for medium environments
# These values override the defaults in values.yaml

# p1as-prometheus (main prometheus server) resource settings
# Path: prometheus.server.resources (prometheus is the subchart alias)
prometheus:
  server:
    resources:
      limits:
        cpu: 3000m
        memory: 10Gi
      requests:
        cpu: 1500m
        memory: 5Gi
