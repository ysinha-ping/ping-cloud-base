# Customer-hub overrides for p1as-observability.
# Customer-hub does not deploy OpenSearch, so opensearch-grafana-credentials
# will never exist. Override optional: false (base) to optional: true so
# prometheus-agent can start without the secret.
prometheus-agent:
  server:
    extraVolumes:
      - name: os-creds
        secret:
          secretName: opensearch-grafana-credentials
          optional: true
          items:
            - key: password
              path: os-password


