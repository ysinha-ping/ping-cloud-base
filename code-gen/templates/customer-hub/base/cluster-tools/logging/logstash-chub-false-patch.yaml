# Applied when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false (default for customer-hub).
# Removes logstash-elastic from the cluster and reduces FluentBit to S3-only output.
# Substituted into region/kustomization.yaml at ArgoCD sync time via ${LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED}.
---
# Removes all logstash-elastic resources that are always included in PCB base.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
$patch: delete
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
$patch: delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
  namespace: elastic-stack-logging
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
$patch: delete
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
$patch: delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logstash-elastic
$patch: delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logstash-elastic
$patch: delete
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: logstash-pdb
  namespace: elastic-stack-logging
$patch: delete
---
# Overwrites fluent-bit-pipeline-outputs ConfigMap to S3-only output.
# disable-opensearch-base-patch.yaml (always active) produces [logstash_customer_out + s3_app_out] outputs.
# This patch further reduces to S3-only when the customer pipeline is disabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        # Default is workers=1 for all outputs; increased for s3 to handle high-volume.
        workers             3
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  4000M
