prometheus:
  server:
    resources:
      limits:
        cpu: 3000m
        memory: 10Gi
      requests:
        cpu: 1500m
        memory: 5Gi

#######################################################
# OpenSearch prod sizing
# Chart defaults (p1as-opensearch/charts/opensearch-cluster/values.yaml): JVM -Xms6g -Xmx6g, 6Gi/10Gi, CPU 2/6.
#######################################################
opensearch-cluster:
  hotNodes:
    jvm: "-Xms6g -Xmx6g"
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        cpu: "6"
        memory: 10Gi
