# Customer-hub overrides for p1as-observability.
# Customer-hub does not deploy OpenSearch, so the opensearch-grafana-credentials secret does not exist.
# Clearing extraVolumes and extraVolumeMounts prevents prometheus-agent from failing when the secret is not found.
prometheus-agent:
  server:
    # Override extraVolumes and extraVolumeMounts to empty arrays. Since customer-hub does not deploy OpenSearch,
    # the opensearch-grafana-credentials secret will not exist and clearing these mounts prevents pod startup failure.
    extraVolumes: []
    extraVolumeMounts: []

# CHUB does not run OpenSearch.
# opensearch.enabled=false skips all chart-emitted OS resources (cluster CR,
# dashboards, services, storageclass, security secret, tenants, SSO PreSync
# Job, cluster-info).
# opensearch-operator.enabled=false suppresses the entire operator subchart
# (Deployment, RBAC, SA, ConfigMap) via the `condition: opensearch-operator.enabled`
# declared in p1as-opensearch/Chart.yaml.
opensearch:
  enabled: false

opensearch-operator:
  enabled: false
