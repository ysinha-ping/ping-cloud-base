kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- ${K8S_GIT_URL}/k8s-configs/cluster-tools/${KUSTOMIZE_BASE}/logging?ref=${K8S_GIT_BRANCH}
- ${DASH_REPO_URL}/os-dashboards?ref=${DASH_REPO_BRANCH}
# This patch must be enabled manually to use KMS encryption (logstash KMS only,
# opensearch KMS is handled by the p1as-opensearch chart via global.ebsKmsKeyArn).
#- kms-storageclass.yaml

images:
- name: ${ECR_REGISTRY_NAME}/pingcloud-monitoring/logstash${ECR_ENV}
  newName: ${ECR_REGISTRY_NAME}/pingcloud-monitoring/logstash${ECR_ENV}
  newTag: ${LOGSTASH_IMAGE_TAG}

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: elk-environment-variables
  behavior: merge
  envs:
  - env_vars

- name: logging-bootstrap-environment-variables
  behavior: merge
  literals:
    - SERVICE_SSM_PATH_PREFIX=${SERVICE_SSM_PATH_PREFIX}
    - REGION=${REGION}

patchesStrategicMerge:
### enrichment-bootstrap service account ###
- |-
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    labels:
      app: enrichment
    name: bootstrap-serviceaccount
    annotations:
      purpose: service-account-for-ping-cloud-stack
      ${IRSA_BOOTSTRAP_ANNOTATION_KEY_VALUE}

- |-
  # Add IRSA role annotation to logstash-elastic service account
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: logstash-elastic
    namespace: elastic-stack-logging
    annotations:
      purpose: service-account-for-logstash-elastic
      ${IRSA_LOGSTASH_ANNOTATION_KEY_VALUE}

- |-
  # Add IRSA role annotation to logstash-elastic-s3 service account
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: logstash-elastic-s3
    namespace: elastic-stack-logging
    annotations:
      purpose: service-account-for-logstash-elastic-s3
      ${IRSA_LOGSTASH_ANNOTATION_KEY_VALUE}

# Logstash KMS storageclass patch must be enabled manually when EBS_KMS_KEY_ARN
# is set. OpenSearch KMS storageclass is handled by the p1as-opensearch chart.
#- kms-patch.yaml

patchesJson6902:
- target:
    group: ""
    version: v1
    kind: ConfigMap
    name: fluent-bit-config
  patch: |-
    - op: replace
      path: /data/newrelic_cluster_name
      value: "${NEW_RELIC_ENVIRONMENT_NAME}"
