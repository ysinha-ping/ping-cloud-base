prometheus:
  server:
    resources:
      limits:
        cpu: 3000m
        memory: 10Gi
      requests:
        cpu: 1500m
        memory: 5Gi

opensearch-cluster:
  hotNodes:
    jvm: "-Xms3g -Xmx3g -XX:MaxDirectMemorySize=1g"
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        cpu: "2"
        memory: 8Gi
