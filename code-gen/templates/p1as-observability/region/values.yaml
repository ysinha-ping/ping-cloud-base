#Cloudwatch related values
cloudwatch:
  enabled : ${CLOUDWATCH_ENABLED}
#The IRSA role ARN to be used for the CWAgent serviceAccount, for the customer environment
  irsaCwAgentAnnotationKeyValue: "${IRSA_CWAGENT_ANNOTATION_KEY_VALUE}"
  image:
    repository: public.ecr.aws/r2h3l6e4/pingcloud-clustertools/amazon/cloudwatch-agent
    tag: 1.300026.3b189

  resources:
    limits:
      cpu:  200m
      memory: 200Mi
    requests:
      cpu: 200m
      memory: 200Mi


#Newrelic related values
global:
  cluster: ${TENANT_NAME}_${ENV}_${REGION}_k8s-cluster

#######################################################
# Prometheus Server (p1as-prometheus) settings
#######################################################
prometheus:
  server:
    # Retention time for Prometheus. Could be set in years(y), weeks(w), days(d), hours(h), minutes(m) or seconds(s)
    retention: "15d"

    persistentVolume:
      # Storage size for prometheus data volume
      # Adjust based on retention period and scrape volume
      size: 30Gi

    statefulSet:
      headless:
        annotations:
          # Prometheus cross-region communication - DNS hostname for the headless service
          external-dns.alpha.kubernetes.io/hostname: prometheus-central.${DNS_ZONE}

    # Environment variables injected into the Prometheus container.
    # The base chart sets external_labels with ${CLUSTER_NAME}, ${TENANT_NAME},
    # ${REGION_NICK_NAME} placeholders and enables --enable-feature=expand-external-labels,
    # so Prometheus expands them at runtime from these env vars.
    env:
      - name: CLUSTER_NAME
        value: ${CLUSTER_NAME}
      - name: TENANT_NAME
        value: ${TENANT_NAME}
      - name: REGION_NICK_NAME
        value: ${REGION_NICK_NAME}

    # Resource limits for dev/test environments (matches legacy PCB base/test size)
    # For prod environments, these are overridden by prod-values.yaml
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi

#######################################################
# Prometheus Job Exporter settings
#######################################################
prometheusJobExporter:
  image:
    tag: v3.0.0
  # Commands and schedules to obtain users count. Values should be in single quotes. 
  promUserCount1Command: "echo 0"
  promUserCount2Command: "echo 0"
  promUserCount3Command: "echo 0"
  promUserCount4Command: "echo 0"

  # Schedules should be in cron format. Command should return only numeric value(int\float)
  promUserCount1Schedule: "* * * * *"
  promUserCount2Schedule: "* * * * *"
  promUserCount3Schedule: "* * * * *"
  promUserCount4Schedule: "* * * * *"

  # Namespace where pingdirectory pods run (for user count commands)
  containerNamespace: ${PING_CLOUD_NAMESPACE}

#######################################################
# Prometheus Agent resource settings
#######################################################
prometheus-agent:
  server:
    # Environment variables for expand-external-labels (same as prometheus server above)
    env:
      - name: CLUSTER_NAME
        value: ${CLUSTER_NAME}
      - name: TENANT_NAME
        value: ${TENANT_NAME}
      - name: REGION_NICK_NAME
        value: ${REGION_NICK_NAME}

    resources:
      limits:
        cpu: 500m
        memory: 4000Mi
      requests:
        cpu: 100m
        memory: 512Mi

    # opensearch-grafana-credentials is created by p14c-integration (opensearch_sso_config.py)
    # which runs as an init container on the OpenSearch operator deployment.
    # In primary CDE regions the secret will exist — optional: false to fail fast if missing.
    # For child/secondary CDE regions, secondary-values.yaml overrides this to optional: true
    # (merged at code-gen time by generate-cluster-state.sh).
    # For customer-hub, chub-values.yaml overrides this to optional: true.
    extraVolumes:
      - name: os-creds
        secret:
          secretName: opensearch-grafana-credentials
          optional: false
          items:
            - key: password
              path: os-password

#######################################################
# OpenSearch (p1as-opensearch) settings
#######################################################
# CDE primary regions: opensearch.enabled=true, IRSA wired, dashboards
# baseRedirectUrl set, SSO bootstrap drives credentials from SSM.
# Secondary regions: secondary-values.yaml keeps opensearch.enabled=true so
# cluster-info CM and the ExternalName ingest Service render; all primary-only
# resources are gated on `eq global.primaryRegion global.region` in templates.
# CHUB: chub-values.yaml sets opensearch.enabled=false outright.

opensearch:
  enabled: true
  irsaRoleArn: "${IRSA_OPENSEARCH_ROLE_ARN}"
  imageTag: "v2.4-release-branch-latest"
  dashboards:
    baseRedirectUrl: "https://logs.${DNS_ZONE}"

sso:
  enabled: true
  customerSsoSsmPathPrefix: "${CUSTOMER_SSO_SSM_PATH_PREFIX}"
  serviceSsmPathPrefix: "${SERVICE_SSM_PATH_PREFIX}"

# CRDs are managed as chart templates (p1as-opensearch/templates/crds.yaml)
# with argocd ServerSideApply. Keep installCRDs=false.
opensearch-operator:
  installCRDs: false
  manager:
    extraInitContainers:
      - name: p1as-bootstrap
        image: "public.ecr.aws/r2h3l6e4/pingcloud-services/bootstrap/dev:v2.4-release-branch-latest"
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 9999
          runAsUser: 9031
        env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CUSTOMER_SSO_SSM_PATH_PREFIX
            value: "${CUSTOMER_SSO_SSM_PATH_PREFIX}"
          - name: SERVICE_SSM_PATH_PREFIX
            value: "${SERVICE_SSM_PATH_PREFIX}"
        volumeMounts:
          - mountPath: /app/config/app_config.yaml
            name: p1as-bootstrap-resources
            readOnly: true
            subPath: p1as-bootstrap-resources.yaml
        resources:
          requests:
            memory: "256Mi"
            cpu: "300m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: p1as-oauth
        image: "public.ecr.aws/r2h3l6e4/pingcloud-services/p14c-integration/dev:v2.4-release-branch-latest"
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsGroup: 9999
          runAsUser: 9031
        env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: TENANT_NAME
            value: "${TENANT_NAME}"
          - name: REGION
            value: "${REGION}"
          - name: ENV
            value: "${ENV}"
          - name: OSD_PUBLIC_HOSTNAME
            value: "logs.${DNS_ZONE}"
          - name: SELF_SERVICE_PUBLIC_HOSTNAME
            value: "self-service-api.${PRIMARY_DNS_ZONE}"
        command:
          - /bin/sh
          - -c
          - python3 -u /app/oauth_client_services_controller.py --app opensearch
        resources:
          requests:
            memory: "256Mi"
            cpu: "300m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  extraVolumes:
    - name: p1as-bootstrap-resources
      configMap:
        name: p1as-bootstrap-resources
