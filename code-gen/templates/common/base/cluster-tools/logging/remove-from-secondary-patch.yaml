# PDO-5984: opensearch resources (cluster CR, headless service, storageclass,
# operator + RBAC, os-manager-config, opensearch-ingest ExternalName) moved to
# the p1as-opensearch chart, which handles secondary-region deletion via
# `eq global.primaryRegion global.region` gating in its templates.
#
# The only piece still needed in PCB for secondary regions is the logstash
# StatefulSet initContainer cleanup (opensearch-bootstrap + wait-for-os-health
# init containers run only in the primary region; the chart's SSO PreSync Job
# replaces them for the operator side, but logstash itself still ships them
# from PCB and needs them removed in secondary regions).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      initContainers:
        - name: opensearch-bootstrap
          $patch: delete
        - name: wait-for-os-health
          $patch: delete
