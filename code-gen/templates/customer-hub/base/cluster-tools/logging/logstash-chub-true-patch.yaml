# Applied when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true for customer-hub.
# Configures logstash-elastic to run only the customer pipeline (disables main and dlq pipelines).
# Redirects readiness/startup probes to port 8084 (main pipeline on 8080 is removed).
# FluentBit outputs remain [logstash_customer_out + s3_app_out] as set by disable-opensearch-base-patch.yaml.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      containers:
      - name: logstash
        readinessProbe:
          httpGet:
            port: 8084
        startupProbe:
          httpGet:
            port: 8084
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
  namespace: elastic-stack-logging
data:
  pipelines.yml: |
    - pipeline.id: customer
      path.config: "/usr/share/logstash/pipeline/customer"
      pipeline.workers: 1
      pipeline.batch.size: 500
      pipeline.batch.delay: 50
      queue.type: persisted
      queue.max_bytes: 10gb
      queue.drain: true
      queue.checkpoint.writes: 128
      dead_letter_queue.enable: false # Intentional — external endpoint, failures dropped by design.

