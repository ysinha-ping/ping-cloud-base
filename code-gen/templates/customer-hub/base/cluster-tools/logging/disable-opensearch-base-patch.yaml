# Overwrites fluent-bit-pipeline-outputs ConfigMap to remove the opensearch (elk) pipeline output (port 8080).
# Always applied in customer-hub. Produces two outputs: logstash_customer_out (port 8084) and s3_app_out.
# disable-logstash-chub-fluentbit-output-patch.yaml (applied after this) further reduces to S3-only when customer pipeline is disabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               logstash_customer_out
        Match               elk.kube.*
        Host                logstash-elastic.elastic-stack-logging
        Port                8084
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  3000M

    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  3000M
