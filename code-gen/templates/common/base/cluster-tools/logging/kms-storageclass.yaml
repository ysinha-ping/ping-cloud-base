# KMS-encrypted gp3 StorageClass for Logstash.
# OpenSearch's KMS StorageClass is owned by the p1as-opensearch chart
# (templates/storageclass.yaml, gated on global.ebsKmsKeyArn).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logstash-gp3-kms
allowVolumeExpansion: true
provisioner: ebs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  csi.storage.k8s.io/fstype: ext4
  encrypted: "true"
  type: gp3
  kmsKeyId: ${EBS_KMS_KEY_ARN}
